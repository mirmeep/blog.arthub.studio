
<div role="tooltip" id="copied">copied!</div>
<div class="coupon-wrapper">
    <div class="coupon"><span class="panic-bold">Use code</span> <span class="panic-red panic-bold" id="coupon_code">{{ .Site.Params.coupon.coupon_code }}</span> for <span class="panic-red panic-bold">{{ .Site.Params.coupon.coupon_percent }}</span> at checkout,  <span>{{- partial "countdown.html" . -}}</span></div>
</div>


<script>
    code = document.getElementById("coupon_code")
    copied = document.getElementById("copied")

    code.onclick = function() {
        document.execCommand("copy");
        copied.style.visibility = "visible"
        window.setTimeout(function(){
            copied.style.opacity = 1;
        },0);
    }
    code.addEventListener("copy", function(e) {
        e.preventDefault();
        if (e.clipboardData) {
            e.clipboardData.setData("text/plain", code.textContent);
        }
    });
</script>
